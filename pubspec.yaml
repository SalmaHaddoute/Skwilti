name: skwilti_app
description: Skwilti - Application IA de generation de QCM
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & UI
  lucide_icons: ^0.257.0
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3

  # File handling
  file_picker: ^8.0.3
  path_provider: ^2.1.1

  # HTTP
  dio: ^5.4.0

  # State management
  provider: ^6.1.1

  # Local storage
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
